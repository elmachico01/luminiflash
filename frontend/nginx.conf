server {
    listen 80;

    # 1. Per qualsiasi richiesta normale, serve i file HTML/CSS/JS
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Quando qualcuno chiede /api/..., gira la richiesta al container "backend"
    location /api/ {
        # "backend" è il nome del servizio nel tuo docker-compose.yml
        # La porta 3000 è quella dove ascolta il tuo server Express
        proxy_pass http://backend:3000;
        
        # Configurazioni standard per passare gli header corretti
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}